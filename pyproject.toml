[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modes-bio"
version = "0.1.0-alpha"
description = "Multi-omics discordance-guided regulatory event state inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Lings"}]
dependencies = [
    "numpy>=1.21", "scipy>=1.7", "pandas>=1.3", "statsmodels>=0.13",
    "anndata>=0.8", "matplotlib>=3.5", "seaborn>=0.11", "networkx>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.5"]

[project.scripts]
modes = "modes.cli:main"

[project.urls]
Repository = "https://github.com/Lings01/MoDES"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "B"]
